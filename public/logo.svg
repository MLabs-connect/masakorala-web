<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="greenTriangle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1db954" />
      <stop offset="100%" stop-color="#14833b" />
    </linearGradient>
    <linearGradient id="slateDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a404d" />
      <stop offset="100%" stop-color="#1d222b" />
    </linearGradient>
    <linearGradient id="slateMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555d6e" />
      <stop offset="100%" stop-color="#343b47" />
    </linearGradient>
    <linearGradient id="slateLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9aa4b2" />
      <stop offset="100%" stop-color="#697382" />
    </linearGradient>
  </defs>

  <!-- Geometric Interlocking 'M' Paver Emblem -->
  <g transform="translate(145, 12)">
    <!-- Top-Left Green Accent Paver -->
    <path d="M 0,6 Q 0,0 6,0 L 52,70 Q 55,75 50,78 L 6,80 Q 0,80 0,74 Z" fill="url(#greenTriangle)" />

    <!-- Upper-Left Diagonal Interlocking Slab -->
    <path d="M 12,85 L 68,162 Q 72,168 78,164 L 118,136 Q 124,132 120,126 L 64,49 Q 60,43 54,47 Z" fill="url(#slateDark)" />

    <!-- Lower-Left Grey Wedge Slab -->
    <path d="M 2,108 L 48,172 Q 52,178 50,184 L 2,184 Q 0,184 0,178 Z" fill="url(#slateLight)" />

    <!-- Bottom Center Anchor Wedge -->
    <path d="M 24,198 L 78,198 Q 84,198 81,192 L 54,154 Q 50,148 45,152 Z" fill="url(#slateMid)" />

    <!-- Central Diagonal Paving Block -->
    <path d="M 76,170 L 132,198 Q 138,200 142,194 L 182,108 Q 186,100 180,98 L 126,69 Q 120,66 116,73 Z" fill="url(#slateDark)" />

    <!-- Center-Right Angular Block -->
    <path d="M 124,54 L 178,82 Q 184,85 188,78 L 222,12 Q 225,5 218,2 L 166,2 Q 160,2 158,8 Z" fill="url(#slateMid)" />

    <!-- Right Pillar Facet -->
    <path d="M 172,102 L 226,192 Q 230,198 224,198 L 148,198 Q 142,198 144,192 Z" fill="url(#slateDark)" />
  </g>

  <!-- Typography: MASAKORALA -->
  <text x="260" y="292" text-anchor="middle" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="4" fill="#14171d">
    MASAKORALA
  </text>

  <!-- Typography: holdings -->
  <text x="260" y="348" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="42" font-weight="400" letter-spacing="6" fill="#2d3748">
    holdings
  </text>
</svg>
